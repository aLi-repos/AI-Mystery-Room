name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Route types (LayoutProps etc.) are generated, not committed —
      # typecheck must run after typegen, before build.
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run build
